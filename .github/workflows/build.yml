name: Release Reel

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Confirm complete source is present
        run: |
          set -euo pipefail
          test -f Package.swift
          test -f build.sh
          test -f Sources/Reel/CarouselView.swift
          test -f Sources/Reel/WallpaperLibrary.swift

      - name: Verify keyboard regression
        run: python3 Tests/test_keyboard_navigation.py

      - name: Parse Swift sources
        run: swiftc -parse Sources/Reel/*.swift

      - name: Build Apple-silicon DMG
        run: |
          test "$(uname -m)" = "arm64"
          export REEL_VERSION="${GITHUB_REF_NAME#v}"
          if [[ -z "$REEL_VERSION" || "$REEL_VERSION" == "$GITHUB_REF_NAME" ]]; then
            REEL_VERSION="1.1.1"
          fi
          ./build.sh --dmg

      - name: Verify Mach-O architecture
        run: |
          file build/Reel.app/Contents/MacOS/Reel
          file build/Reel.app/Contents/MacOS/Reel | grep -q 'arm64'

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: Reel-${{ github.ref_name }}-arm64
          path: build/Reel.dmg

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: build/Reel.dmg
